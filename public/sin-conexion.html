<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin conexión — Pagasa</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; background: #054095; color: #111318; padding: 16px; box-sizing: border-box; }
  .caja { background: #fff; border-radius: 12px; padding: 28px 24px; max-width: 360px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  img { width: 72px; height: 72px; }
  h1 { color: #054095; font-size: 20px; margin: 12px 0 8px; }
  p { font-size: 15px; line-height: 1.45; color: #374151; }
  button { margin-top: 12px; background: #054095; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 15px; }
</style>
</head>
<body>
  <div class="caja">
    <img src="/logos/icono-192.png" alt="">
    <h1>Sin conexión con el sistema</h1>
    <p>El celular no alcanza al servidor. Revisa que estés conectado al wifi de la empresa (el sistema solo funciona dentro de la red de Pagasa).</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
